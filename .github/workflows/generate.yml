name: Generate Podcast Feed

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      YT_COOKIES: ${{ secrets.YT_COOKIES }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate YouTube cookies
        run: |
          printf '%s' "$YT_COOKIES" > .cookies_tmp.txt

          echo "Cookie file size:"
          wc -c .cookies_tmp.txt

          echo "Cookie file line count:"
          wc -l .cookies_tmp.txt

          echo "First line:"
          head -n 1 .cookies_tmp.txt

          echo "Validating Netscape format..."

          python - <<'PY'
          from http.cookiejar import MozillaCookieJar

          path = ".cookies_tmp.txt"

          try:
              jar = MozillaCookieJar(path)
              jar.load(
                  ignore_discard=True,
                  ignore_expires=True
              )

              print("Cookie file: VALID")
              print("Cookies loaded:", len(jar))

          except Exception as e:
              print("Cookie file: INVALID")
              print(type(e).__name__ + ":", str(e))
              raise
          PY

      - name: Generate podcast feed
        run: |
          python generate_feed.py

      - name: Check generated files
        run: |
          echo "Generated files:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            ! -path './.cookies_tmp.txt' \
            -print

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
